<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mi Tabla</title>
        <link rel="stylesheet" href="estilos5.css" />
    </head>
    <body>
    
        <table>
     <caption>Mi Horario</caption>
     <thead>
        <tr>
            <th>Hora</th>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">8:00 - 9:00</th>
                <td>Matemáticas</td>
                <td>Física</td>
                <td>Química</td>
                
            </tr>
            <tr>
                <th scope="row">9:00 - 10:00</th>
                <td>Lengua</td>
                <td>Historia</td>
                <td>Geografía</td>
            </tr>
            <tr>
                <th scope="row">10:00 - 11:00</th>
                <td>Inglés</td>
                <td>Fifa </td>
                <td>Arte</td>
            </tr>
            <tr>
                <th scope="row">11:00 - 12:00</th>
                <td colspan="3">Recreo</td>
            </tr>
        </tbody>
    </body>
    </html>
