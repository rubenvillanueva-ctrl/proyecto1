<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style4.css">
  <title>Formulario de Contacto</title>
</head>
<body>
  <fieldset>
    <form action="procesar_formulario.php" method="post">
    <legend>Datos de Contacto</legend>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" maxlength="40"  pattern="[A-Za-z]+"
           title="Solo letras (mayúsculas y minúsculas), máximo 40 caracteres"  placeholder="Introduce tu nombre"
           required autofocus required>

    <label for="cp">Código postal:</label>
    <input type="text" id="cp" name="cp" pattern="[0-9]{5}" 
         maxlength="5" pattern="[0-9]{5}"  title="Exactamente 5 números"  placeholder="Ej: 41001"  required>

    <label for="edad">Edad:</label>
    <input type="text" id="edad" name="edad"  maxlength="2" inputmode="numeric"
           pattern="[0-9]{2}"  title="Solo uno o dos dígitos numéricos"  placeholder="Ej: 25" required>

   <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email"  maxlength="50"  placeholder="Ej: tuemail@dominio.com"
       pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"  title="Introduce un correo electrónico válido"    
           required>
    <button type="submit">Enviar</button>
  </fieldset>
</body>
</html>
