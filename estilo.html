<!DOCTYPE  html>
<html>
    <head><meta charset="UTF-8"></head>
    <head>
        <title>Mi pagina web</title>
        <link rel="stylesheet" href="style2.css">
    </head>
     <body>
            <header>REGISTRO </header>
            <form action="respuesta.html"> 
                
                <fieldset>
                    <legend>DATOS PERSONALES</legend><br>
                     <label for="nombre"> Nombre </label><br>
                     <input type="text" id = 'nombre' name="nombre" placeholder="Mi nombre" required minlength="2" maxlength="50"><br><br>
                     <label for="apellidos"> Apellidos </label><br>
                     <input type="text" id = 'apellidos' name="apellidos" placeholder=" Apellidos" required minlength="2" maxlength="50"><br><br>
                     <label for="correo-electronico"> Correo Electronico </label><br>
                     <input type="email" id = 'correo-electronico' name="correo-electronico" placeholder="Mi.correo@electronico.es" required minlength="2" maxlength="50"><br><br>
                     <label for="contraseña"> Contraseña</label><br>
                     <input type="password" id="contraseña" name="contraseña" required minlength="1" maxlength="30"><br><br>
                     <label for="telefono">Telefono</label><br>
                     <input type="tel" id="telefono" name="telefono" placeholder="Telefono" pattern="`[0-9+]{9,15}"><br><br>
                     <label for="pagina privada"></label><br>
                     <input type="url" id="pagina privada" name="pagina privada" placeholder="ww.pagina.es"><br><br>
                     <label for="edad">Edad</label><br>
                     <input type="number" id="edad" name="edad" placeholder="Tu edad" min="18" max="99"><br><br>
                     <label for="cumpleaños">Fecha</label><br>
                     <input type="date" id="cumpleaños" name="cumpleaños" placeholder="cumpleaños" min="01/01/1960" max="01/01/2027"><br><br>
                     <label for="reserva">Reserva</label><br>
                     <input type="time" id="reserva" name="reserva" placeholder="Te esperamos" min="09:00:00" max="20:00:00"><br><br>

                    </fieldset>
                    <fieldset> 
                        <legend>Elige el metodo de contacto</legend>
                        <input type="radio" id="contacto email" name="contacto" value="email">
                        <label for="contacto email">Contacto email</label><br>
                         <input type="radio" id="contacto telefono" name="contacto" value="telefono">
                        <label for="contacto telefono">Contacto telefono</label><br>
                         <input type="radio" id="contacto cartas" name="contacto" value="cartas">
                        <label for="contacto cartas">contacto cartas</label><br>
                    </fieldset>
            
            </form>
        </body>
    
    





</html>
